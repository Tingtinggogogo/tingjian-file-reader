# Use a distinct --project-name and .env file for each environment.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reader
      POSTGRES_USER: reader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a database password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U reader -d reader']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://reader:${POSTGRES_PASSWORD}@db/reader
      SESSION_SECRET: ${SESSION_SECRET:?set a session secret}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set the HTTPS origin}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ENABLE_EDGE_TTS: ${ENABLE_EDGE_TTS:-true}
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - audio:/data
    networks: [internal, egress]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 80
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-18080}:8080'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [egress]
volumes:
  postgres:
  audio:
networks:
  internal:
    internal: true
  egress:
